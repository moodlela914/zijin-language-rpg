<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>過場節拍檢視</title><style>body{font:15px system-ui;margin:24px;background:#e9e2d1;color:#223d37}h1{font-size:23px}section{display:grid;gap:18px;grid-template-columns:repeat(3,1fr)}figure{margin:0}iframe{width:100%;aspect-ratio:16/9;border:1px solid #c2a364;background:#173b33}figcaption{font-size:12px;line-height:1.8;margin-top:8px}select{padding:8px;margin-bottom:20px}@media(max-width:800px){section{grid-template-columns:1fr}}</style><h1>情境過場 · 三節拍檢視</h1><p>同一組可 seek 的原生動畫，依序檢查場景、對話框與任務揭示。主遊戲播放長度為 11.2 秒，可略過。</p><label>場景 <select id="chapter"></select></label><section id="frames"></section><script type="module">
import {chapters} from '/zijin-language-rpg/src/data/chapters.js';
const select=document.querySelector('#chapter'),frames=document.querySelector('#frames');
select.innerHTML=chapters.map(c=>'<option value="'+c.id+'">'+c.title+'</option>').join('');
function show(){frames.innerHTML='';for(const [time,label] of [[1.5,'場景與關卡標題'],[4.8,'人物與對話框'],[9.3,'任務揭示']]){const figure=document.createElement('figure'),frame=document.createElement('iframe'),caption=document.createElement('figcaption');frame.title=label;frame.src='/zijin-language-rpg/public/cinematics/'+select.value+'.html';frame.onload=()=>{for(const a of frame.contentDocument.getAnimations()){a.pause();a.currentTime=time*1000;}};caption.textContent=time+' 秒 · '+label;figure.append(frame,caption);frames.append(figure);}}select.onchange=show;show();
</script></html>
