<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>紫禁語文弈 · 玩法試玩台</title><link rel="stylesheet" href="/zijin-language-rpg/src/styles.css?v=7e7e8f105b06"><link rel="stylesheet" href="/zijin-language-rpg/src/game.css?v=7e7e8f105b06"><link rel="stylesheet" href="/zijin-language-rpg/src/exploration.css?v=7e7e8f105b06"><link rel="stylesheet" href="/zijin-language-rpg/src/trials.css?v=7e7e8f105b06"><style>body{padding:28px;max-width:1100px;margin:auto}.test-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.test-bar select{padding:10px;max-width:100%;background:#faf6e7;border:1px solid #c5bd9d;color:#264535}.test-bar label{font-size:12px;display:flex;gap:7px;align-items:center}.test-description{font-size:12px;line-height:1.9;color:#758068}h1{font-size:28px}h2{font-size:23px}.test-prompt{background:#214638;color:#f3e9cd;padding:22px;font:18px/1.9 serif;margin-top:25px}.test-scene{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;align-self:start;border:1px solid #aa956b}#result:empty{display:none}@media(max-width:720px){body{padding:18px}.test-prompt{font-size:17px}.test-bar{gap:10px}}</style></head><body><h1>十二關玩法試玩台</h1><p class="test-description">可直接切換關卡與題目，測試各種操作。此頁不寫入正式遊戲進度；完整旅程仍由皇城地圖開始。</p><div class="test-bar"><label>關卡<select id="chapter" aria-label="試玩關卡"></select></label><label>題目<select id="question" aria-label="試玩題目"></select></label><button class="quiet" id="music-toggle">背景音樂</button><button class="quiet" id="sfx-toggle">音效</button><a class="quiet" href="/zijin-language-rpg/">返回完整遊戲</a></div><div class="scene-question-layout"><img class="test-scene" id="scene" alt="關卡場景"><div id="prompt" class="dialogue question-card"></div></div><div id="activity"></div><div id="result" class="notice" role="status"></div><div class="actions"><button class="primary" id="retry">重試此題</button><button class="quiet" id="next">下一題／下一關 →</button></div><script type="module">
import {questions} from '/zijin-language-rpg/src/data/questions.js?v=7e7e8f105b06';
import {chapters} from '/zijin-language-rpg/src/data/chapters.js?v=7e7e8f105b06';
import {backgrounds} from '/zijin-language-rpg/src/data/assets.js?v=7e7e8f105b06';
import {createGame,answer} from '/zijin-language-rpg/src/game/engine.js?v=7e7e8f105b06';
import {mountTrial,unmountTrial,renderTrial,clearTrialDrafts} from '/zijin-language-rpg/src/game/trial-interactions.js?v=7e7e8f105b06';
import {audioPreferences,musicPreferences,setAudioEnabled,setMusicEnabled,playCue,setMusicContext} from '/zijin-language-rpg/src/game/audio-player.js?v=7e7e8f105b06';
const select=document.querySelector('#chapter'),questionSelect=document.querySelector('#question'),activity=document.querySelector('#activity'),result=document.querySelector('#result');
select.innerHTML=chapters.map(c=>'<option value="'+c.id+'">'+c.number+'. '+c.title+'</option>').join('');
function setQuestions(){questionSelect.innerHTML=questions.filter(q=>q.chapterId===select.value).map((q,i)=>'<option value="'+q.id+'">第 '+(i+1)+' 題 · '+q.concept+'</option>').join('');show();}
function show(){unmountTrial();clearTrialDrafts();const q=questions.find(q=>q.id===questionSelect.value);document.querySelector('#scene').src=backgrounds[q.chapterId];const prompt=document.querySelector('#prompt');prompt.replaceChildren();const paragraph=document.createElement('p');paragraph.textContent=q.prompt;prompt.append(paragraph);result.innerHTML='';result.className='notice';let s={...createGame(),phase:'question',questionId:q.id};activity.innerHTML=renderTrial(q);mountTrial(document.querySelector('#trial-interactive'),q,s,{onOperate:()=>playCue('chineseMechanism'),onSubmit:(choiceId,response)=>{s=answer(s,choiceId,Date.now(),response);unmountTrial();activity.querySelectorAll('button,input').forEach(n=>n.disabled=true);result.className='notice '+(s.feedback.correct?'success':'error');result.innerHTML='';const strong=document.createElement('strong'),detail=document.createElement('p'),actual=document.createElement('p');strong.textContent=s.feedback.correct?'判讀正確':'再辨析一次';actual.textContent='你的操作：'+response.summary;detail.textContent=q.explanation;result.append(strong,actual,detail);playCue(s.feedback.correct?'puzzleSolved':'wrong');result.scrollIntoView({behavior:'smooth',block:'center'});}});setMusicContext(false);}
select.onchange=setQuestions;questionSelect.onchange=show;document.querySelector('#retry').onclick=show;document.querySelector('#next').onclick=()=>{const i=questions.findIndex(q=>q.id===questionSelect.value),q=questions[(i+1)%questions.length];select.value=q.chapterId;setQuestions();questionSelect.value=q.id;show();document.querySelector('#prompt').scrollIntoView({behavior:'smooth',block:'start'});};
function labels(){document.querySelector('#music-toggle').textContent=musicPreferences().enabled?'背景音樂：開':'背景音樂：關';document.querySelector('#sfx-toggle').textContent=audioPreferences().enabled?'音效：開':'音效：關';}
document.querySelector('#music-toggle').onclick=()=>{setMusicEnabled(!musicPreferences().enabled);labels();};document.querySelector('#sfx-toggle').onclick=()=>{setAudioEnabled(!audioPreferences().enabled);labels();};setQuestions();labels();
</script></body></html>
